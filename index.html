<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>True Lane</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    /* Animated gradient background */
    #bg-gradient {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 20% 50%, rgba(30, 15, 60, 0.6) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 50%, rgba(10, 25, 50, 0.5) 0%, transparent 60%),
                  radial-gradient(ellipse at 50% 100%, rgba(20, 10, 40, 0.4) 0%, transparent 50%);
      animation: bgShift 12s ease-in-out infinite alternate;
      z-index: 0;
    }
    @keyframes bgShift {
      0% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.7; transform: scale(1.02); }
    }

    /* Subtle grid overlay */
    #bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    /* Floating particles */
    #particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      animation: float linear infinite;
    }
    @keyframes float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    #page-wrapper {
      position: relative;
      display: flex;
      flex-direction: row;
      width: 100%; height: 100%;
      z-index: 2;
    }
    #unity-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      overflow: hidden;
    }
    #unity-canvas {
      height: 100%;
      aspect-ratio: 9 / 16;
      max-width: 100%;
      background: #111;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      box-shadow: 0 0 15px 2px rgba(100, 120, 255, 0.15), 0 0 40px 5px rgba(100, 120, 255, 0.08);
      animation: canvasGlow 4s ease-in-out infinite alternate;
    }
    @keyframes canvasGlow {
      0% { box-shadow: 0 0 15px 2px rgba(100, 120, 255, 0.1), 0 0 40px 5px rgba(100, 120, 255, 0.05); }
      100% { box-shadow: 0 0 20px 4px rgba(120, 100, 255, 0.2), 0 0 60px 10px rgba(100, 120, 255, 0.1); }
    }
    #unity-loading-bar {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 10;
    }
    #unity-logo {
      width: 154px; height: 130px;
      background: url('TemplateData/unity-logo-dark.png') no-repeat center;
    }
    #unity-progress-bar-empty {
      width: 141px; height: 18px;
      margin-top: 10px; margin-left: 6.5px;
      background: url('TemplateData/progress-bar-empty-dark.png') no-repeat center;
    }
    #unity-progress-bar-full {
      width: 0%; height: 18px; margin-top: 10px;
      background: url('TemplateData/progress-bar-full-dark.png') no-repeat center;
    }
    #unity-warning {
      position: absolute; left: 50%; top: 5%;
      transform: translate(-50%);
      background: white; padding: 10px;
      display: none; z-index: 20;
    }

    #build-info {
      position: absolute;
      bottom: 12px; right: 16px;
      text-align: right;
      z-index: 5;
      pointer-events: none;
    }
    #build-info .title {
      font-size: 104px;
      font-weight: 700;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(180, 160, 255, 0.4);
      text-shadow: 0 0 25px rgba(120, 100, 255, 0.2), 0 0 50px rgba(120, 100, 255, 0.08);
      margin-bottom: 6px;
      animation: textPulse 4s ease-in-out infinite alternate;
    }
    @keyframes textPulse {
      0% { text-shadow: 0 0 20px rgba(120, 100, 255, 0.3), 0 0 40px rgba(120, 100, 255, 0.1); }
      100% { text-shadow: 0 0 30px rgba(120, 100, 255, 0.5), 0 0 60px rgba(120, 100, 255, 0.2); }
    }
    #build-info .label {
      font-size: 44px;
      font-weight: 600;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(140, 180, 255, 0.5);
      border-bottom: 1px solid rgba(120, 100, 255, 0.2);
      padding-bottom: 4px;
      margin-bottom: 4px;
      text-shadow: 0 0 10px rgba(100, 140, 255, 0.2);
    }
    #build-info .version {
      font-size: 56px;
      font-weight: 300;
      letter-spacing: 4px;
      color: rgba(140, 160, 255, 0.4);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 8px rgba(100, 120, 255, 0.15);
    }

    @media (max-width: 600px) {
      #page-wrapper { flex-direction: column; }
      #sidebar { padding: 6px 0; }
      #sidebar h1 {
        font-size: 16px;
        letter-spacing: 3px;
      }
      #unity-canvas {
        width: 100%;
        height: auto;
        aspect-ratio: 9 / 16;
        max-height: calc(100vh - 36px);
      }
    }
  </style>
</head>
<body>
  <div id="bg-gradient"></div>
  <div id="bg-grid"></div>
  <div id="particles"></div>
  <div id="page-wrapper">
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <div id="build-info">
      <div class="title">True Lane</div>
      <div class="label">Testing Lab</div>
      <div class="version">v0.1.3 &middot; #4</div>
    </div>
  </div>

  <script>
    var canvas = document.querySelector('#unity-canvas');
    var loadingBar = document.querySelector('#unity-loading-bar');
    var progressBarFull = document.querySelector('#unity-progress-bar-full');
    var warningBanner = document.querySelector('#unity-warning');

    function unityShowBanner(msg, type) {
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function() {
          warningBanner.removeChild(div);
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }, 5000);
      }
      warningBanner.style.display = 'block';
    }

    var buildUrl = 'Build';
    var loaderUrl = buildUrl + '/LWBuilds.loader.js';
    var config = {
      dataUrl: buildUrl + '/LWBuilds.data.unityweb',
      frameworkUrl: buildUrl + '/LWBuilds.framework.js.unityweb',
      codeUrl: buildUrl + '/LWBuilds.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'DefaultCompany',
      productName: 'LW',
      productVersion: '0.1.0',
      showBanner: unityShowBanner,
    };

    loadingBar.style.display = 'block';

    var script = document.createElement('script');
    script.src = loaderUrl;
    script.onload = function() {
      createUnityInstance(canvas, config, function(progress) {
        progressBarFull.style.width = 100 * progress + '%';
      }).then(function(unityInstance) {
        loadingBar.style.display = 'none';
        // Pause background animations to free GPU for the game
        document.getElementById('bg-gradient').style.animation = 'none';
        document.getElementById('particles').style.display = 'none';
      }).catch(function(message) {
        alert(message);
      });
    };
    document.body.appendChild(script);

    // Generate particles
    var particlesEl = document.getElementById('particles');
    for (var i = 0; i < 10; i++) {
      var p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (8 + Math.random() * 16) + 's';
      p.style.animationDelay = (Math.random() * 20) + 's';
      p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
      particlesEl.appendChild(p);
    }
  </script>
</body>
</html>
